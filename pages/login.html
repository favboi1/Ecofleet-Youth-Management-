<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

    <title>Login | EYVMS</title>
</head>

<body class="login-page">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../css/supabase.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const loginForm = document.getElementById("loginForm");
    const roleButtons = document.querySelectorAll(".role-btn");
    let selectedRole = "volunteer";

    roleButtons.forEach((button) => {
        button.addEventListener("click", () => {
            roleButtons.forEach((btn) => {
                btn.classList.toggle("active", btn === button);
                btn.setAttribute("aria-pressed", String(btn === button));
            });
            selectedRole = button.textContent.trim().toLowerCase();
        });
    });

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("Login failed: " + error.message);
            return;
        }

        if (selectedRole === "admin") {
            const { data: profile, error: profileError } = await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", data.user.id)
                .maybeSingle();

            if (profileError || !profile || profile.role !== "admin") {
                alert("This account is not registered as an admin.");
                return;
            }

            window.location.href = "../admin-dashboard.html";
            return;
        }

        window.location.href = "../volunteer-dashboard.html";

    });

});
</script>

    <div class="login-container">

        <div class="login-logo">
            <img src="../assets/ecofleet-logo.png" alt="Ecofleet Solutions Logo">
        </div>

        <div class="login-header">
            <span>EYVMS</span>
            <h1>Welcome Back</h1>
            <p>Sign in to access the monitoring system.</p>
        </div>


        <!-- ROLE SELECTION -->

        <div class="role-selector">

            <button class="role-btn active" type="button">
                Volunteer
            </button>

            <button class="role-btn" type="button">
                Admin
            </button>

        </div>


        <!-- LOGIN FORM -->

        <form class="login-form" id="loginForm">

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
    >

    <div class="login-options">

        <label class="remember">
            <input type="checkbox">
            Remember me
        </label>

        <a href="#">Forgot password?</a>

    </div>

    <button type="submit" class="login-submit">
        Sign In
    </button>

</form>

        <a href="../index.html" class="back-home">
            ← Back to Homepage
        </a>

    </div>

</body>

</html>
